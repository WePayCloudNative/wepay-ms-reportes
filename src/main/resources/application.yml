
server:
  port: 8087

spring:
  application:
    name: wepay-ms-reportes

  profiles:
    default: local

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    consumer:
      group-id: wepay-reportes-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Spring confirma el offset recién después de procesar (ver listener.ack-mode)
      enable-auto-commit: false
      # Máximo de eventos por lectura: lotes chicos, procesados uno a uno
      max-poll-records: 50
      properties:
        # Si el consumidor deja de responder 15 s, Kafka reparte sus particiones a otro
        session.timeout.ms: 15000
        heartbeat.interval.ms: 5000
        # Tiempo máximo entre lecturas antes de considerarlo bloqueado
        max.poll.interval.ms: 300000
        # Al rebalancear, solo se mueven las particiones necesarias (sin pausar todo el grupo)
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # --- Confiabilidad del envío ---
      # all: el broker confirma solo cuando el mensaje está en las réplicas sincronizadas
      # (min.insync.replicas=2 en el clúster de 3 brokers)
      acks: all
      retries: 5
      compression-type: lz4
      properties:
        # Idempotente: si un envío se reintenta, Kafka no guarda el mensaje dos veces
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        retry.backoff.ms: 500
        request.timeout.ms: 10000
        delivery.timeout.ms: 30000
        # Junta mensajes hasta 5 ms antes de enviar (menos viajes a la red)
        linger.ms: 5
    listener:
      # Confirma cada evento apenas se procesa: si el servicio cae, a lo más se repite uno
      # (los consumidores ignoran duplicados por eventId)
      ack-mode: record
      # 3 hilos = 1 por partición de orders.events (el orden por pedido se mantiene)
      concurrency: 3

  jpa:
    open-in-view: false
